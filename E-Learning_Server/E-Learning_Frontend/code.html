<!DOCTYPE html>
<html>

<head>
    <title>CodeLab</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="topbar">
        <div class="brand">☕ CodeLab</div>

        <div class="actions">
            <select id="languageSelect">
            <option value="c">C</option>
            <option value="java">Java</option>
            <option value="python">Python</option>
        </select>

            <button onclick="toggleTheme()">Theme</button>

            <button class="submit">Submit</button>
        </div>
    </div>

    <div class="container">

        <!-- Sidebar -->
        <div class="sidebar">
            <div class="menu-title">Problem</div>
            <div class="menu-item active" onclick="loadProblem(1,'A')">Problem A</div>
            <div class="menu-item" onclick="loadProblem(1,'B')">Problem B</div>
            <div class="menu-item" onclick="loadProblem(1,'C')">Problem C</div>

        </div>

        <!-- Main -->
        <div class="content">

            <div class="problem-panel">
                <h2 id="problem-title"></h2>
                <p id="problem-description"></p>

                <h4>Input</h4>
                <pre id="problem-input"></pre>

                <h4>Output</h4>
                <pre id="problem-output"></pre>
            </div>


            <div class="editor-section">
                <div class="editor-header">
                    <span>main.js</span>
                </div>
                <div id="editor" style="height:500px;"></div>



                <div class="output-section">
                    <div class="output-Spilt">
                        <div class="output-header">Output</div>
                        <button class="run" onclick="runCode()">Run</button>
                    </div>
                    <div id="output"></div>

                </div>
            </div>
        </div>
    </div>



    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
